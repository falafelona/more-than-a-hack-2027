# Python package definition for `falafelona` (code lives in src/falafelona/).
# Exact pins live in requirements.txt; only direct dependencies are listed here.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "falafelona"
version = "0.1.0"
description = "Team Falafelona: per-frame ball possession for More Than a Hack 2027"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "pandas", "PyYAML"]

[project.scripts]
falafelona = "falafelona.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["vendor"]
