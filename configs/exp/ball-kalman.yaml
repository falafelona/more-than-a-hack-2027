# Experiment: fill gaps in the ball track with a Kalman filter and RTS smoother (task 2.5, issue #35).
# Copy of baseline.yaml, only `ball:` changed.
# The numbers below are PLACEHOLDERS. Choose them on other matches (D15), never on this one.
# Key meanings: see "Method `kalman`" in src/falafelona/ball.py.
seed: 0

ball:
  method: kalman
  process_noise: 8.0      # m/s^2: std of the random acceleration (a kick is one). Larger: the path may bend more
  measurement_noise: 0.3  # m: std of a tracked ball position
  initial_speed_std: 15.0 # m/s: std of the ball's speed before its first sighting of a half
  max_sigma: 2.0          # m: fill a gap only if the smoothed position std stays below this everywhere in it
  max_speed: 40.0         # m/s: do not fill a gap if the ball could not have crossed it this fast
  speed_slack: 1.0        # m: tracking noise allowed on top of max_speed * time

deadball:
  method: ball_missing    # score 1 wherever the ball is not observed, else 0 (unfilled gaps stay missing, so stay dead)

possession:
  method: nearest_majority
  window: 50              # centred majority vote over +/- 50 frames
  dead_threshold: 0.5     # frames with dead score >= this give no team vote

output:
  x_policy: none          # D14 still proposed: no X written yet
